query ExportBlogs($after: String) {
  blogs(first: 10, after: $after) {
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      handle
      title
      templateSuffix
      articles(first: 100) {
        nodes {
          handle
          title
          author {
            name
          }
          body
          summary
          tags
          isPublished
          templateSuffix
          image {
            url
            altText
          }
        }
      }
    }
  }
}
