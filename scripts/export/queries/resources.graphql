query ExportResources($ids: [ID!]!) {
  nodes(ids: $ids) {
    __typename
    ... on Collection {
      id
      handle
    }
    ... on Product {
      id
      handle
    }
    ... on Page {
      id
      handle
    }
    ... on Blog {
      id
      handle
    }
    ... on Article {
      id
      handle
      blog {
        handle
      }
    }
    ... on ShopPolicy {
      id
      type
    }
  }
}
