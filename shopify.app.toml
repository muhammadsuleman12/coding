# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "58a0e997ee1bd53381b27d22937c6f28"
application_url = "https://example.com"
embedded = true
name = "AI Store Builder"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# write_* scopes include the matching read_* access.
#   themes                    themeCreate / themePublish / theme files (needs the theme exemption)
#   products                  products, variants, collections, product metafield definitions
#   publications              publish imported products/collections to the Online Store
#   content                   blogs and articles
#   online_store_pages        pages
#   online_store_navigation   menus and URL redirects
#   files                     images and other files
#   metaobjects               metaobject entries
#   metaobject_definitions    metaobject definitions
#   legal_policies            shop policies
scopes = "write_themes,write_products,write_publications,write_content,write_online_store_pages,write_online_store_navigation,write_files,write_metaobjects,write_metaobject_definitions,write_legal_policies"
optional_scopes = [ ]
use_legacy_install_flow = false

[webhooks]
api_version = "2026-10"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Mandatory privacy webhooks for public apps
  # Handled by: /app/routes/webhooks.compliance.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [ ]
